<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>VibeTap</title>
<style>
  body { margin:0; background:#fff; color:#111; font-family:Arial, sans-serif; display:flex; flex-direction:column; align-items:center; min-height:100vh; padding-bottom:40px; }
  .menu-bar { width:100%; background:#FFD60A; padding:24px 16px; text-align:center; }
  .menu-bar h1 { margin:0 0 16px 0; font-size:1.4rem; }
  .mood-grid { display:flex; flex-wrap:wrap; justify-content:center; gap:10px; max-width:700px; margin:0 auto; }
  .mood-btn { border:none; border-radius:12px; padding:16px 20px; font-size:1rem; font-weight:700; color:#fff; cursor:pointer; min-width:110px; }
  .result { margin-top:28px; font-size:1.3rem; font-weight:700; text-align:center; min-height:1.6em; }
  .songs { margin-top:6px; font-size:0.95rem; font-style:italic; color:#555; text-align:center; max-width:620px; padding:0 16px; }
  .chord-row { display:flex; flex-wrap:wrap; justify-content:center; gap:14px; margin-top:24px; padding:0 12px; }
  .chord-card { background:#fff; border-radius:10px; padding:8px; box-shadow:0 1px 4px rgba(0,0,0,0.15); }
  .placeholder { margin-top:40px; color:#555; font-size:1rem; text-align:center; padding:0 20px; }
</style>
</head>
<body>

<div class="menu-bar">
  <h1>Pick a mood</h1>
  <div class="mood-grid" id="moodGrid"></div>
</div>

<div class="result" id="resultLabel"></div>
<div class="songs" id="songsLabel"></div>
<div class="chord-row" id="chordRow"></div>
<div class="placeholder" id="placeholder">Tap a mood above to see a chord progression.</div>

<script>
const PROGRESSIONS = {
  "Happy":     { key: "C Major", progression: ["C","G","Am","F"], songs: ["Don't Stop Believin' \u2013 Journey", "Let It Be \u2013 The Beatles"], color: "#FB8500" },
  "Sad":       { key: "A Minor", progression: ["Am","F","C","G"], songs: ["Zombie \u2013 The Cranberries", "The Scientist \u2013 Coldplay"], color: "#457B9D" },
  "Chill":     { key: "G Major", progression: ["G","D","Em","C"], songs: ["Let Her Go \u2013 Passenger"], color: "#48CAE4" },
  "Nostalgic": { key: "A Minor", progression: ["Am","F","C","G"], songs: ["Complicated \u2013 Avril Lavigne", "Africa \u2013 Toto"], color: "#9C6644" },
  "Hopeful":   { key: "G Major", progression: ["G","Em","C","D"], songs: ["Stand By Me \u2013 Ben E. King", "Heart and Soul \u2013 Hoagy Carmichael"], color: "#2D9D5F" },
  "Tense":     { key: "A Minor", progression: ["Am","G","F","E"], songs: ["Hit the Road Jack \u2013 Ray Charles", "Tequila \u2013 The Champs"], color: "#E63946" },
  "Dreamy":    { key: "C Major", progression: ["Cadd9","G","Am7","Fmaj7"], songs: ["Wonderwall \u2013 Oasis"], color: "#B185DB" },
  "Angry":     { key: "D Minor", progression: ["Dm","C","Bb","A"], songs: ["Sultans of Swing \u2013 Dire Straits", "One More Cup of Coffee \u2013 Bob Dylan"], color: "#D00000" }
};

const CHORD_SHAPES = {
  "C": [-1,3,2,0,1,0], "G": [3,2,0,0,0,3], "D": [-1,-1,0,2,3,2],
  "E": [0,2,2,1,0,0], "A": [-1,0,2,2,2,0], "B": [-1,2,4,4,4,2],
  "Am": [-1,0,2,2,1,0], "Em": [0,2,2,0,0,0], "Dm": [-1,-1,0,2,3,1],
  "Bm": [-1,2,4,4,3,2], "F": [1,3,3,2,1,1], "Bb": [-1,1,3,3,3,1],
  "Am7": [-1,0,2,0,1,0], "Fmaj7": [-1,-1,3,2,1,0], "Cadd9": [-1,3,2,0,3,0]
};

const moodGrid = document.getElementById("moodGrid");
Object.keys(PROGRESSIONS).forEach(mood => {
  const btn = document.createElement("button");
  btn.className = "mood-btn";
  btn.textContent = mood;
  btn.style.background = PROGRESSIONS[mood].color;
  btn.onclick = () => showProgression(mood);
  moodGrid.appendChild(btn);
});

function drawChordDiagram(chordName) {
  const canvas = document.createElement("canvas");
  canvas.width = 100;
  canvas.height = 130;
  const ctx = canvas.getContext("2d");

  ctx.fillStyle = "#111";
  ctx.font = "bold 13px Arial";
  ctx.textAlign = "center";
  ctx.fillText(chordName, 50, 15);

  const shape = CHORD_SHAPES[chordName];
  const leftMargin = 20, topMargin = 30, stringSpacing = 12, fretSpacing = 20, numFrets = 4;

  if (!shape) {
    ctx.font = "11px Arial";
    ctx.fillStyle = "#888";
    ctx.fillText("(no shape)", 50, 70);
    return canvas;
  }

  ctx.strokeStyle = "#111";
  ctx.lineWidth = 1;
  for (let i = 0; i < 6; i++) {
    const x = leftMargin + i * stringSpacing;
    ctx.beginPath();
    ctx.moveTo(x, topMargin);
    ctx.lineTo(x, topMargin + numFrets * fretSpacing);
    ctx.stroke();
  }
  for (let f = 0; f <= numFrets; f++) {
    const y = topMargin + f * fretSpacing;
    ctx.beginPath();
    ctx.moveTo(leftMargin, y);
    ctx.lineTo(leftMargin + 5 * stringSpacing, y);
    ctx.stroke();
  }

  shape.forEach((fret, i) => {
    const x = leftMargin + i * stringSpacing;
    if (fret === -1) {
      ctx.fillStyle = "#e63946";
      ctx.font = "11px Arial";
      ctx.fillText("x", x, topMargin - 10);
    } else if (fret === 0) {
      ctx.strokeStyle = "#111";
      ctx.beginPath();
      ctx.arc(x, topMargin - 12, 4, 0, Math.PI * 2);
      ctx.stroke();
    } else {
      const y = topMargin + (fret - 1) * fretSpacing + fretSpacing / 2;
      ctx.fillStyle = "#111";
      ctx.beginPath();
      ctx.arc(x, y, 5, 0, Math.PI * 2);
      ctx.fill();
    }
  });

  return canvas;
}

function showProgression(mood) {
  const data = PROGRESSIONS[mood];
  document.getElementById("placeholder").style.display = "none";
  document.getElementById("resultLabel").textContent = mood + " \u2192 " + data.key + "   |   " + data.progression.join(" - ");
  document.getElementById("songsLabel").textContent = "Inspired by: " + data.songs.join("   |   ");

  const row = document.getElementById("chordRow");
  row.innerHTML = "";
  data.progression.forEach(chord => {
    const card = document.createElement("div");
    card.className = "chord-card";
    card.appendChild(drawChordDiagram(chord));
    row.appendChild(card);
  });
}
</script>

</body>
</html>
