<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VibeTap</title>

<style>
  body {
    margin: 0;
    background: #fff;
    color: #111;
    font-family: Arial, sans-serif;
    min-height: 100vh;
    padding-bottom: 30px;
  }

  .menu-bar {
    width: 100%;
    box-sizing: border-box;
    background: #FFD60A;
    padding: 24px 16px;
    text-align: center;
  }

  .menu-bar h1 {
    margin: 0 0 18px 0;
    font-size: 1.4rem;
  }

  .mood-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    max-width: 400px;
    margin: 0 auto;
  }

  .mood-btn {
    border: none;
    border-radius: 12px;
    padding: 15px 8px;
    font-size: 0.95rem;
    font-weight: 700;
    color: #fff;
    cursor: pointer;
    min-height: 52px;
  }

  .result {
    margin-top: 25px;
    padding: 0 16px;
    font-size: 1.2rem;
    font-weight: 700;
    text-align: center;
    min-height: 1.6em;
  }

  .songs {
    margin-top: 8px;
    padding: 0 18px;
    font-size: 0.9rem;
    font-style: italic;
    color: #555;
    text-align: center;
  }

  .chord-row {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    max-width: 330px;
    margin: 22px auto 0;
    padding: 0 12px;
  }

  .chord-card {
    background: #fff;
    border-radius: 10px;
    padding: 6px;
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.15);
    display: flex;
    justify-content: center;
  }

  .placeholder {
    margin-top: 35px;
    color: #555;
    font-size: 0.95rem;
    text-align: center;
    padding: 0 20px;
  }

  @media (min-width: 600px) {
    .mood-grid {
      grid-template-columns: repeat(4, 1fr);
      max-width: 700px;
    }

    .mood-btn {
      padding: 16px 20px;
    }

    .chord-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 700px;
    }
  }
</style>
</head>

<body>

<div class="menu-bar">
  <h1>Pick a mood</h1>
  <div class="mood-grid" id="moodGrid"></div>
</div>

<div class="result" id="resultLabel"></div>

<div class="songs" id="songsLabel"></div>

<div class="chord-row" id="chordRow"></div>

<div class="placeholder" id="placeholder">
  Tap a mood above to see a chord progression.
</div>

<script>
const PROGRESSIONS = {
  "Happy": {
    key: "C Major",
    progression: ["C","G","Am","F"],
    songs: ["Don't Stop Believin' – Journey", "Let It Be – The Beatles"],
    color: "#FB8500"
  },

  "Sad": {
    key: "A Minor",
    progression: ["Am","F","C","G"],
    songs: ["Zombie – The Cranberries", "The Scientist – Coldplay"],
    color: "#457B9D"
  },

  "Chill": {
    key: "G Major",
    progression: ["G","D","Em","C"],
    songs: ["Let Her Go – Passenger"],
    color: "#48CAE4"
  },

  "Nostalgic": {
    key: "A Minor",
    progression: ["Am","F","C","G"],
    songs: ["Complicated – Avril Lavigne", "Africa – Toto"],
    color: "#9C6644"
  },

  "Hopeful": {
    key: "G Major",
    progression: ["G","Em","C","D"],
    songs: ["Stand By Me – Ben E. King", "Heart and Soul – Hoagy Carmichael"],
    color: "#2D9D5F"
  },

  "Tense": {
    key: "A Minor",
    progression: ["Am","G","F","E"],
    songs: ["Hit the Road Jack – Ray Charles", "Tequila – The Champs"],
    color: "#E63946"
  },

  "Dreamy": {
    key: "C Major",
    progression: ["Cadd9","G","Am7","Fmaj7"],
    songs: ["Wonderwall – Oasis"],
    color: "#B185DB"
  },

  "Angry": {
    key: "D Minor",
    progression: ["Dm","C","Bb","A"],
    songs: ["Sultans of Swing – Dire Straits", "One More Cup of Coffee – Bob Dylan"],
    color: "#D00000"
  }
};

const CHORD_SHAPES = {
  "C": [-1,3,2,0,1,0],
  "G": [3,2,0,0,0,3],
  "D": [-1,-1,0,2,3,2],
  "E": [0,2,2,1,0,0],
  "A": [-1,0,2,2,2,0],
  "B": [-1,2,4,4,4,2],
  "Am": [-1,0,2,2,1,0],
  "Em": [0,2,2,0,0,0],
  "Dm": [-1,-1,0,2,3,1],
  "Bm": [-1,2,4,4,3,2],
  "F": [1,3,3,2,1,1],
  "Bb": [-1,1,3,3,3,1],
  "Am7": [-1,0,2,0,1,0],
  "Fmaj7": [-1,-1,3,2,1,0],
  "Cadd9": [-1,3,2,0,3,0]
};

const moodGrid = document.getElementById("moodGrid");

Object.keys(PROGRESSIONS).forEach(mood => {
  const btn = document.createElement("button");

  btn.className = "mood-btn";
  btn.textContent = mood;
  btn.style.background = PROGRESSIONS[mood].color;

  btn.onclick = () => showProgression(mood);

  moodGrid.appendChild(btn);
});

function drawChordDiagram(chordName) {
  const canvas = document.createElement("canvas");

  canvas.width = 100;
  canvas.height = 130;

  const ctx = canvas.getContext("2d");

  ctx.fillStyle = "#111";
  ctx.font = "bold 13px Arial";
  ctx.textAlign = "center";

  ctx.fillText(chordName, 50, 15);

  const shape = CHORD_SHAPES[chordName];

  const leftMargin = 20;
  const topMargin = 30;
  const stringSpacing = 12;
  const fretSpacing = 20;
  const numFrets = 4;

  if (!shape) {
    ctx.font = "11px Arial";
    ctx.fillStyle = "#888";
    ctx.fillText("(no shape)", 50, 70);
    return canvas;
  }

  ctx.strokeStyle = "#111";
  ctx.lineWidth = 1;

  for (let i = 0; i < 6; i++) {
    const x = leftMargin + i * stringSpacing;

    ctx.beginPath();
    ctx.moveTo(x, topMargin);
    ctx.lineTo(x, topMargin + numFrets * fretSpacing);
    ctx.stroke();
  }

  for (let f = 0; f <= numFrets; f++) {
    const y = topMargin + f * fretSpacing;

    ctx.beginPath();
    ctx.moveTo(leftMargin, y);
    ctx.lineTo(leftMargin + 5 * stringSpacing, y);
    ctx.stroke();
  }

  shape.forEach((fret, i) => {
    const x = leftMargin + i * stringSpacing;

    if (fret === -1) {
      ctx.fillStyle = "#e63946";
      ctx.font = "11px Arial";
      ctx.fillText("x", x, topMargin - 10);

    } else if (fret === 0) {
      ctx.strokeStyle = "#111";

      ctx.beginPath();
      ctx.arc(x, topMargin - 12, 4, 0, Math.PI * 2);
      ctx.stroke();

    } else {
      const y =
        topMargin +
        (fret - 1) * fretSpacing +
        fretSpacing / 2;

      ctx.fillStyle = "#111";

      ctx.beginPath();
      ctx.arc(x, y, 5, 0, Math.PI * 2);
      ctx.fill();
    }
  });

  return canvas;
}

function showProgression(mood) {
  const data = PROGRESSIONS[mood];

  document.getElementById("placeholder").style.display = "none";

  document.getElementById("resultLabel").textContent =
    mood + " → " +
    data.key +
    "   |   " +
    data.progression.join(" - ");

  document.getElementById("songsLabel").textContent =
    "Inspired by: " +
    data.songs.join("   |   ");

  const row = document.getElementById("chordRow");

  row.innerHTML = "";

  data.progression.forEach(chord => {
    const card = document.createElement("div");

    card.className = "chord-card";

    card.appendChild(
      drawChordDiagram(chord)
    );

    row.appendChild(card);
  });
}
</script>

</body>
</html>
